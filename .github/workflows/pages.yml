name: ScreenFix Pages

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('screenfix-pages-pr-{0}', github.event.pull_request.number) || 'screenfix-pages-deploy' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run site contract tests
        run: |
          python3 -m unittest discover -s tests/site -p 'test_*.py' -v
          node --test tests/site/platform.test.mjs
      - name: Validate Pages-equivalent archive
        shell: bash
        run: |
          set -euo pipefail
          validation_archive="$RUNNER_TEMP/pages-validation.tar"
          expected_manifest="$RUNNER_TEMP/pages-expected.txt"
          actual_manifest="$RUNNER_TEMP/pages-actual.txt"
          tar --dereference --hard-dereference --directory site -cf "$validation_archive" .
          find site -type f -print | sed 's#^site/##' | LC_ALL=C sort > "$expected_manifest"
          tar -tf "$validation_archive" | sed -e 's#^\./##' -e '/\/$/d' -e '/^$/d' | LC_ALL=C sort > "$actual_manifest"
          diff -u "$expected_manifest" "$actual_manifest"

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run site contract tests
        run: |
          python3 -m unittest discover -s tests/site -p 'test_*.py' -v
          node --test tests/site/platform.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - name: Inspect uploaded Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          expected_manifest="$RUNNER_TEMP/pages-expected.txt"
          actual_manifest="$RUNNER_TEMP/pages-actual.txt"
          find site -type f -print | sed 's#^site/##' | LC_ALL=C sort > "$expected_manifest"
          tar -tf "$RUNNER_TEMP/artifact.tar" | sed -e 's#^\./##' -e '/\/$/d' -e '/^$/d' | LC_ALL=C sort > "$actual_manifest"
          diff -u "$expected_manifest" "$actual_manifest"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
